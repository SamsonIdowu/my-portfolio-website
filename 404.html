<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>404 &mdash; Samson Idowu</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0a0e14; --bg-grid: rgba(45,212,191,0.045);
    --surface: #111722; --border: #1f2937;
    --text: #e6edf3; --muted: #8b97a6; --faint: #5b6675;
    --accent: #2dd4bf;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    background: var(--bg); color: var(--text);
    min-height: 100vh; display: flex; flex-direction: column;
    -webkit-font-smoothing: antialiased;
    background-image:
      linear-gradient(var(--bg-grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px);
    background-size: 56px 56px;
  }
  a { color: inherit; text-decoration: none; }
  nav {
    border-bottom: 1px solid var(--border);
    padding: 16px 28px;
    display: flex; align-items: center;
  }
  .brand { font-size: 14px; font-weight: 600; }
  .brand .sigil { color: var(--accent); }
  .brand .cursor { color: var(--accent); animation: blink 1.2s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  main {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 48px 28px;
  }
  .code {
    font-family: "Space Grotesk", system-ui, sans-serif;
    font-size: clamp(5rem, 18vw, 9rem);
    font-weight: 700; letter-spacing: -0.04em;
    color: var(--surface); line-height: 1;
    text-shadow: 0 0 0 var(--border), 1px 1px 0 var(--border);
    -webkit-text-stroke: 1px var(--border);
  }
  .code .hi { -webkit-text-stroke: 1px var(--accent); color: transparent; }
  .msg {
    font-size: 14px; color: var(--muted); margin: 28px 0 32px; max-width: 36ch; line-height: 1.7;
  }
  .msg code { color: var(--accent); background: rgba(45,212,191,0.08); padding: 2px 6px; border-radius: 4px; }
  .actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .btn {
    font-family: "JetBrains Mono", monospace; font-size: 13px; font-weight: 500;
    padding: 11px 20px; border-radius: 8px; border: 1px solid var(--border);
    cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
    transition: transform .18s, border-color .2s, color .2s;
    background: var(--surface); color: var(--text);
  }
  .btn:hover { transform: translateY(-2px); border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--accent); color: #06231f; border-color: var(--accent); }
  .btn.primary:hover { background: #5fe5d4; color: #06231f; }
  footer {
    border-top: 1px solid var(--border); padding: 22px 28px;
    display: flex; justify-content: center;
  }
  footer span { font-size: 12px; color: var(--faint); }
</style>
</head>
<body>
<nav>
  <a href="index.html" class="brand"><span class="sigil">~/</span>samson.idowu<span class="cursor">_</span></a>
</nav>
<main>
  <div class="code"><span class="hi">4</span>0<span class="hi">4</span></div>
  <p class="msg">No rule matched this path.<br><code>event.url</code> does not exist in the ruleset.</p>
  <div class="actions">
    <a href="index.html" class="btn primary">&#x2190; Go home</a>
    <a href="index.html#project" class="btn">Projects</a>
    <a href="index.html#contact" class="btn">Contact</a>
  </div>
</main>
<footer>
  <span>built for signal, not noise</span>
</footer>
</body>
</html>
